# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: postgres
  password: <%= ENV.fetch("DATABASE_PASSWORD") { 'postgres' } %>
  host: localhost

development:
  <<: *default
  # Здесь должно быть просто имя базы данных, А НЕ путь к файлу!
  database: hotel_booking_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: hotel_booking_test

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  <<: *default
  database: hotel_booking_production
  username: hotel_booking
  password: <%= ENV["HOTEL_BOOKING_DATABASE_PASSWORD"] %>
